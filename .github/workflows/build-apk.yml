name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 cmdline-tools;latest'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed debug APK
        run: |
          ls -la app/debug.keystore
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee /tmp/build.log | tail -50
          # Show signing related lines
          grep -iE "sign|keystore|Signing" /tmp/build.log | tail -30 || true

      - name: Verify APK signature with apksigner
        run: {
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK=$APK size=$(stat -c%s "$APK")"
          # Prefer build-tools apksigner
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(find $ANDROID_HOME -name apksigner 2>/dev/null | head -1)
          fi
          echo "APKSIGNER=$APKSIGNER"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK" || {
              echo "apksigner verify failed — re-signing with jarsigner/apksigner"
              "$APKSIGNER" sign --ks app/debug.keystore --ks-pass pass:android \
                --ks-key-alias androiddebugkey --key-pass pass:android \
                --v1-signing-enabled true --v2-signing-enabled true \
                "$APK"
              "$APKSIGNER" verify --verbose "$APK"
            }
          else
            echo "apksigner not found, using jarsigner"
            jarsigner -verify -verbose -certs "$APK" || {
              jarsigner -keystore app/debug.keystore -storepass android -keypass android \
                "$APK" androiddebugkey
              jarsigner -verify -verbose -certs "$APK"
            }
          fi
          echo "SIGNED_OK"
        }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualPhoneController-v1.0.6-Signed-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
