name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 cmdline-tools;latest'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK is signed
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK=$APK"
          ls -la "$APK"
          unzip -l "$APK" | grep -E 'META-INF/.*\.(SF|RSA|DSA|EC)' || {
            echo "ERROR: APK is not signed"
            unzip -l "$APK" | grep META-INF | head -30
            exit 1
          }
          echo "Signature entries found:"
          unzip -l "$APK" | grep -E 'META-INF/.*\.(SF|RSA|DSA|EC|MF)'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualPhoneController-v1.0.6-Signed-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
